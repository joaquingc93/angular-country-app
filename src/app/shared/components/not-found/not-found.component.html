<div class="hero min-h-[400px] bg-base-200 rounded-lg">
  <div class="hero-content text-center">
    <div class="max-w-md">
      <div class="text-9xl mb-4">🔍</div>
      <h1 class="text-5xl font-bold">Oops!</h1>
      <p class="py-6 text-xl">{{ message() }}</p>
      <button (click)="goBack()" class="btn btn-primary btn-lg">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          />
        </svg>
        Volver atrás
      </button>
    </div>
  </div>
</div>
