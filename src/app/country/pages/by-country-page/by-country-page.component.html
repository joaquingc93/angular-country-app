<!-- country-search-input -->
<country-search-input
  placeholder="Buscar por país"
  (value)="countryQuery.set($event.trim())"
  [initialValue]="countryQuery()"
/>

@if (countriesResource.isLoading()) {
<p class="mt-4">Cargando...</p>
} @else if (countriesResource.error()) {
<p class="text-error mt-4">Error al cargar datos</p>
} @else if (countriesResource.hasValue()) {
<country-list [countries]="countriesResource.value()" />
} @else {
<p class="mt-4">Ingresa un país para buscar.</p>
}
