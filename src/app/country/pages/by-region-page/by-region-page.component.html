<h3 class="text-2xl font-bold mb-4">Buscar por Región</h3>

<!-- Selector de regiones -->
<div class="flex flex-wrap gap-2 mb-6">
  @for (region of regions; track region) {
  <button
    class="btn btn-sm"
    [class.btn-primary]="selectedRegion() === region"
    [class.btn-outline]="selectedRegion() !== region"
    (click)="onRegionChange(region)"
  >
    {{ region }}
  </button>
  }
</div>

<!-- Estados del resource -->
@if (countriesResource.isLoading()) {
<p class="mt-4">Cargando países...</p>
} @else if (countriesResource.error()) {
<p class="text-error mt-4">Error al cargar datos de la región</p>
} @else if (countriesResource.hasValue()) {
<country-list [countries]="countriesResource.value()" />
} @else {
<p class="mt-4">Selecciona una región para ver los países.</p>
}
