<section class="mt-5">
  <table class="table table-md mt-2 w-full">
    <thead>
      <tr>
        <th>#</th>
        <th>Ícono</th>
        <th>Bandera</th>
        <th>Nombre</th>
        <th>Capital</th>
        <th>Población</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (country of countries();track country.cca2; let index=$index) {
      <tr>
        <td>{{ index + 1 }}</td>
        <td>{{ country.flag }}</td>
        <td>
          <img
            width="30"
            height="20"
            [src]="country.flagSvg"
            [alt]="country.name"
          />
        </td>
        <td>{{ country.flag }}</td>
        <td>{{ country.name }}</td>
        <td>{{ country.capital }}</td>
        <td>{{ country.population }}</td>
        <td>
          <a class="link-primary">Ver más...</a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</section>
